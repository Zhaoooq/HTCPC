<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTCPC 颗粒数目浓度监测</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101d;
      --panel: #0d1a2b;
      --line: #20344f;
      --muted: #91a4bb;
      --text: #edf5ff;
      --cyan: #35d4e8;
      --green: #45d58a;
      --red: #ff6f7c;
      --button: #173250;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 15% 0%, #12304b 0, var(--bg) 42%);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); font-weight: 650; letter-spacing: .04em; }
    .subtitle { color: var(--muted); margin-top: 7px; font-size: 14px; }
    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 99px; background: #0a1625cc; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 12px currentColor; }
    .online .dot { background: var(--green); }
    button { font: inherit; color: var(--text); }
    .save-btn { min-height: 39px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--button); cursor: pointer; white-space: nowrap; }
    .save-btn:hover { border-color: var(--cyan); background: #1c3d61; }
    .save-btn:active { transform: translateY(1px); }
    .save-btn:disabled { color: var(--muted); cursor: not-allowed; opacity: .58; }
    .grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2.2fr); gap: 18px; }
    .panel { border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(145deg, #102137e8, #0a1524ed); box-shadow: 0 20px 50px #0005; }
    .reading { padding: 26px; min-height: 320px; display: flex; flex-direction: column; }
    .label { color: var(--muted); font-size: 14px; }
    .number { margin-top: 22px; font: 650 clamp(46px, 8vw, 78px)/1 "Segoe UI", sans-serif; letter-spacing: -.045em; color: var(--cyan); overflow-wrap: anywhere; }
    .unit { color: #bad0e5; margin-top: 12px; font-size: 20px; }
    .details { margin-top: auto; border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 12px; }
    .row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
    .row strong { color: var(--text); font-weight: 500; text-align: right; }
    .chart { min-height: 440px; padding: 22px; }
    .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 18px; font-weight: 600; }
    canvas { width: 100%; height: 360px; display: block; }
    .notice { min-height: 24px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    @media (max-width: 760px) {
      main { width: min(100% - 20px, 1180px); padding-top: 18px; }
      header { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .reading { min-height: 280px; }
      .chart { min-height: 400px; padding: 16px; }
      canvas { height: 320px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>HTCPC 颗粒数目浓度监测</h1>
        <div class="subtitle">树莓派实时采集 · 有线局域网只读看板</div>
      </div>
      <div class="actions">
        <button class="save-btn" id="saveCsv" type="button" disabled>保存数据</button>
        <div class="badge" id="connection"><span class="dot"></span><span id="connectionText">正在连接</span></div>
      </div>
    </header>

    <section class="grid">
      <article class="panel reading">
        <div class="label">当前颗粒数目浓度</div>
        <div class="number" id="value">--</div>
        <div class="unit" id="unit">个/ml</div>
        <div class="details">
          <div class="row"><span>采集状态</span><strong id="acquiring">等待连接</strong></div>
          <div class="row"><span>最新数据</span><strong id="capturedAt">--</strong></div>
          <div class="row"><span>本次时间</span><strong id="elapsed">--</strong></div>
          <div class="row"><span>已记录点数</span><strong id="count">0</strong></div>
        </div>
      </article>

      <article class="panel chart">
        <div class="chart-head">
          <h2>最近 10 分钟趋势</h2>
          <span class="label">自动量程</span>
        </div>
        <canvas id="plot"></canvas>
        <div class="notice" id="notice">等待第一组有效数据……</div>
      </article>
    </section>
  </main>

  <script>
    const ui = {
      connection: document.getElementById('connection'),
      connectionText: document.getElementById('connectionText'),
      value: document.getElementById('value'), unit: document.getElementById('unit'),
      acquiring: document.getElementById('acquiring'), capturedAt: document.getElementById('capturedAt'),
      elapsed: document.getElementById('elapsed'), count: document.getElementById('count'),
      notice: document.getElementById('notice'), canvas: document.getElementById('plot'),
      saveCsv: document.getElementById('saveCsv')
    };
    let points = [];
    let polling = false;
    let latestSnapshot = null;
    let remoteRecordingActive = false;
    let remoteRecordingStartSequence = 0;

    function formatValue(value) {
      if (!Number.isFinite(value)) return '--';
      if (Math.abs(value) >= 100000) return value.toExponential(3);
      if (Math.abs(value) >= 1000) return value.toFixed(0);
      if (Math.abs(value) >= 10) return value.toFixed(1);
      return value.toFixed(2);
    }

    function formatClock(iso) {
      if (!iso) return '--';
      const date = new Date(iso);
      return Number.isNaN(date.getTime()) ? '--' : date.toLocaleString('zh-CN', { hour12: false });
    }

    function updateUi(data) {
      latestSnapshot = data;
      ui.connection.classList.add('online');
      ui.connectionText.textContent = '有线连接正常';
      ui.value.textContent = data.valid ? formatValue(data.concentration) : '--';
      ui.unit.textContent = data.unit || '个/ml';
      ui.acquiring.textContent = data.acquiring ? '正在采集' : '已停止';
      ui.acquiring.style.color = data.acquiring ? 'var(--green)' : 'var(--muted)';
      ui.capturedAt.textContent = formatClock(data.captured_at);
      ui.elapsed.textContent = data.valid ? `${Number(data.acquisition_time_seconds).toFixed(1)} s` : '--';
      ui.count.textContent = String(data.history_count || 0);
      points = Array.isArray(data.history) ? data.history : [];
      const baseNotice = points.length
        ? `当前显示 ${points.length} 个数据点；页面每秒自动刷新。`
        : (data.acquiring ? '正在采集，等待第一组有效数据……' : '树莓派当前未进行 OPC 采集。');
      ui.notice.textContent = remoteRecordingActive
        ? `${baseNotice} 正在保存本段数据，再次点击“停止保存”下载。`
        : baseNotice;
      updateSaveButton();
      drawChart();
    }

    async function poll() {
      if (polling) return;
      polling = true;
      try {
        const response = await fetch('/api/snapshot', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        updateUi(await response.json());
      } catch (error) {
        ui.connection.classList.remove('online');
        ui.connectionText.textContent = '连接已断开';
        ui.acquiring.textContent = '未知';
        ui.notice.textContent = '无法连接树莓派，正在自动重试……';
        updateSaveButton();
      } finally {
        polling = false;
      }
    }

    function latestSequence() {
      const snapshotSequence = Number(latestSnapshot && latestSnapshot.sample_sequence);
      if (Number.isFinite(snapshotSequence) && snapshotSequence >= 0) return Math.floor(snapshotSequence);
      const sequences = points.map(point => Number(point.sequence)).filter(Number.isFinite);
      return sequences.length ? Math.max(...sequences) : 0;
    }

    function updateSaveButton() {
      const acquiring = Boolean(latestSnapshot && latestSnapshot.acquiring);
      ui.saveCsv.disabled = !remoteRecordingActive && !acquiring;
      ui.saveCsv.textContent = remoteRecordingActive ? '停止保存' : '保存数据';
    }

    function toggleRemoteRecording() {
      if (!remoteRecordingActive) {
        if (!(latestSnapshot && latestSnapshot.acquiring)) return;
        remoteRecordingStartSequence = latestSequence();
        remoteRecordingActive = true;
        ui.notice.textContent = '已开始保存本段数据；再次点击“停止保存”下载到 Windows 本地目录。';
        updateSaveButton();
        return;
      }

      remoteRecordingActive = false;
      updateSaveButton();
      const fromSequence = remoteRecordingStartSequence + 1;
      ui.notice.textContent = '正在生成本段 CSV；请在 Windows 浏览器中选择保存位置。';
      window.location.href = `/api/history.csv?from_sequence=${encodeURIComponent(fromSequence)}&t=${Date.now()}`;
    }

    function drawChart() {
      const canvas = ui.canvas;
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(240, Math.floor(rect.height));
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);

      const pad = { left: 66, right: 18, top: 18, bottom: 42 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const values = points.map(p => Number(p.value)).filter(Number.isFinite);
      const maxValue = values.length ? Math.max(...values) : 1;
      const yMax = Math.max(10, maxValue * 1.18);

      ctx.font = '12px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const y = pad.top + plotH * i / 5;
        ctx.strokeStyle = '#20344f';
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
        ctx.fillStyle = '#91a4bb';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(formatValue(yMax * (1 - i / 5)), pad.left - 10, y);
      }
      ctx.fillStyle = '#91a4bb';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('较早', pad.left, height - pad.bottom + 14);
      ctx.fillText('现在', width - pad.right, height - pad.bottom + 14);

      if (!values.length) return;
      const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
      gradient.addColorStop(0, '#35d4e84d'); gradient.addColorStop(1, '#35d4e800');
      const xAt = i => pad.left + (points.length === 1 ? plotW : plotW * i / (points.length - 1));
      const yAt = value => pad.top + plotH * (1 - Math.max(0, value) / yMax);

      ctx.beginPath();
      points.forEach((point, i) => {
        const x = xAt(i), y = yAt(Number(point.value));
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.lineTo(xAt(points.length - 1), pad.top + plotH);
      ctx.lineTo(xAt(0), pad.top + plotH); ctx.closePath();
      ctx.fillStyle = gradient; ctx.fill();

      ctx.beginPath();
      points.forEach((point, i) => {
        const x = xAt(i), y = yAt(Number(point.value));
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = '#35d4e8'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    }

    window.addEventListener('resize', drawChart);
    ui.saveCsv.addEventListener('click', toggleRemoteRecording);
    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
